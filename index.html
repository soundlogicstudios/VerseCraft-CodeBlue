<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Code Blue – Season One</title>
<link rel="stylesheet" href="./styles.css" />
</head>
<body>

<main class="intro-root">

  <section class="panel active" data-panel="1"></section>
  <section class="panel" data-panel="2"></section>
  <section class="panel" data-panel="3"></section>
  <section class="panel" data-panel="4"></section>
  <section class="panel" data-panel="5"></section>

  <div class="title-card">
    <div class="title">CODE BLUE</div>
    <div class="subtitle">Season One</div>
    <button id="startBtn">START</button>
  </div>

</main>

<script>
(() => {
  const panels = document.querySelectorAll('.panel');
  let current = 0;
  let timer;

  function show(index) {
    panels.forEach((panel, i) => {
      panel.classList.toggle('active', i === index);
    });
  }

  function next() {
    current = (current + 1) % panels.length;
    show(current);
  }

  timer = setInterval(next, 9000);

  document.getElementById('startBtn').addEventListener('click', () => {
    clearInterval(timer);
    document.querySelector('.title-card').classList.add('fade-out');
  });

})();
</script>

</body>
</html>
