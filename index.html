<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Code Blue – Season One</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>

<main class="intro-root" id="introRoot">

  <!-- SPLASH (FIRST SCREEN) -->
  <section class="splash" id="splash" aria-label="Splash Screen">
    <div class="splash-ui">
      <button class="splash-btn" id="enterBtn" type="button">ENTER</button>
      <div class="splash-hint">Tap to begin</div>
    </div>
  </section>

  <!-- INTRO PANELS -->
  <section class="panel" data-panel="1"></section>
  <section class="panel" data-panel="2"></section>
  <section class="panel" data-panel="3"></section>
  <section class="panel" data-panel="4"></section>
  <section class="panel" data-panel="5"></section>

  <section class="panel kinetic" data-panel="6"></section>
  <section class="panel" data-panel="7"></section>
  <section class="panel" data-panel="8"></section>
  <section class="panel kinetic" data-panel="9"></section>

  <!-- FX overlays -->
  <div class="light-overlay" id="lightOverlay"></div>
  <div class="vignette"></div>

  <!-- TITLE CARD (APPEARS AFTER SPLASH ENTER) -->
  <div class="title-card" id="titleCard" hidden>
    <div class="title">CODE BLUE</div>
    <div class="subtitle">Season One</div>
    <button id="startBtn" type="button">TAP TO START</button>
  </div>

  <!-- CHARACTER SELECT (hidden until TITLE CARD tap) -->
  <section class="character-select" id="characterSelect" hidden aria-label="Choose your character">
    <div class="cs-ui">
      <div class="cs-title">Choose Your Character</div>

      <!-- Left = Celeste, Right = Adrian -->
      <div class="cs-buttons">
        <button class="cs-btn left"  id="chooseCeleste" type="button">Dr. Celeste Marlowe</button>
        <button class="cs-btn right" id="chooseAdrian"  type="button">Dr. Adrian Cole</button>
      </div>

      <button class="cs-start" id="startShiftBtn" type="button" disabled>Start Shift</button>
      <div class="cs-note" id="csNote">Select a character to begin.</div>
    </div>
  </section>

  <!-- THEME MUSIC -->
  <audio id="themeAudio" preload="auto" loop>
    <source src="./assets/audio/code_blue_theme.mp3" type="audio/mpeg">
  </audio>


  <!-- STORY HARNESS (ENGINE TESTBED) -->
  <section class="story-harness" id="storyHarness" hidden aria-label="Story Screen">
    <div class="story-bg" id="storyBg" aria-hidden="true"></div>
    <div class="story-ui">
      <div class="story-topbar">
        <button class="story-btn" id="btnVoice" aria-pressed="false" type="button">Voice: OFF</button>
        <button class="story-btn" id="btnExitStory" type="button">Exit</button>
      </div>

      <div class="story-narrative" id="panelNarrative"></div>

      <div class="story-choices">
        <button class="choice-pill" id="choice0" type="button"><span></span></button>
        <button class="choice-pill" id="choice1" type="button"><span></span></button>
        <button class="choice-pill" id="choice2" type="button"><span></span></button>
        <button class="choice-pill" id="choice3" type="button"><span></span></button>
      </div>
    </div>
  </section>


</main>

<script type="module">
  import { PanelEngine } from "./core/panel_engine.js";
  import { tts } from "./core/tts.js";

window.__vc_initialized = true;
(() => {
  const root = document.getElementById('introRoot');

  const splash = document.getElementById('splash');
  const enterBtn = document.getElementById('enterBtn');

  const panels = Array.from(document.querySelectorAll('.panel'));
  const overlay = document.getElementById('lightOverlay');

  const titleCard = document.getElementById('titleCard');
  const startBtn = document.getElementById('startBtn');

  const characterSelect = document.getElementById('characterSelect');
  const themeAudio = document.getElementById('themeAudio');

  const chooseCeleste = document.getElementById('chooseCeleste');
  const chooseAdrian  = document.getElementById('chooseAdrian');
  const startShiftBtn = document.getElementById('startShiftBtn');
  const csNote = document.getElementById('csNote');

  const byId = (n) => panels.find(p => p.dataset.panel === String(n));

  // Flashing panels (keep your existing + include 1)
  const flashSet = new Set([1, 6, 9]);

  // Montage order (unchanged)
  const order = [
    9, 1, 6, 2, 8, 3, 4, 7, 5,
    1, 6, 2, 9, 3, 8, 5
  ];

  let idx = 0;
  let timer = null;
  let montageStarted = false;
  let selected = null;
  // Story JSON id to load based on POV selection
  let storyIdSelected = 'code_blue';

  function setActive(panelNum) {
    panels.forEach(p => p.classList.remove('active'));
    const el = byId(panelNum);
    if (el) el.classList.add('active');

    if (flashSet.has(panelNum)) overlay.classList.add('hot');
    else overlay.classList.remove('hot');
  }

  function next() {
    idx = (idx + 1) % order.length;
    setActive(order[idx]);
  }

  function startLoop() {
    if (timer) clearInterval(timer);
    timer = setInterval(next, 8000);
  }

  function stopLoop() {
    if (timer) clearInterval(timer);
    timer = null;
  }

  // Initial state: show a static first frame behind splash (no loop yet)
  setActive(order[0]);
  stopLoop();

  async function startMontageAndMusic() {
    if (montageStarted) return;
    montageStarted = true;

    // show title card now that the montage is live
    titleCard.hidden = false;

    // begin montage
    startLoop();

    // start theme music (allowed because user clicked)
    try {
      themeAudio.volume = 0.85;
      await themeAudio.play();
    } catch (_) {}
  }

  // Expose a global fallback hook (in case module init is blocked)
  window.__vc_enter = async () => {
    try { await startMontageAndMusic(); } catch(_) {}
    splash.classList.add('fade-out');
    setTimeout(() => { splash.hidden = true; }, 450);
  };


  // SPLASH ENTER -> start music + slideshow + reveal title card
  enterBtn.addEventListener('click', async () => {
    await startMontageAndMusic();

    // fade splash out and remove it
    splash.classList.add('fade-out');
    setTimeout(() => {
      splash.hidden = true;
    }, 450);
  });

  // TITLE CARD TAP -> go to character select (do not restart music/montage)
  startBtn.addEventListener('click', () => {
    stopLoop();
    titleCard.classList.add('fade-out');
    root.classList.add('show-character-select');

    // show character select
    setTimeout(() => {
      characterSelect.hidden = false;
      characterSelect.classList.add('show');
    }, 250);
  });

  function setSelected(which) {
    selected = which;

    // POV wiring: choose voice profile + JSON id
    if (which === 'adrian') {
      storyIdSelected = 'code_blue_adrian';
      tts.setVoiceProfile('male');
    } else if (which === 'celeste') {
      storyIdSelected = 'code_blue_celeste';
      tts.setVoiceProfile('female');
    } else {
      storyIdSelected = 'code_blue';
      tts.setVoiceProfile('auto');
    }

    chooseCeleste.classList.toggle('active', which === 'celeste');
    chooseAdrian.classList.toggle('active', which === 'adrian');

    startShiftBtn.disabled = !selected;
    csNote.textContent = selected
      ? `Selected: ${which === 'celeste' ? 'Dr. Celeste Marlowe' : 'Dr. Adrian Cole'}`
      : 'Select a character to begin.';
  }

    startShiftBtn.disabled = !selected;
    csNote.textContent = selected
      ? `Selected: ${which === 'celeste' ? 'Dr. Celeste Marlowe' : 'Dr. Adrian Cole'}`
      : 'Select a character to begin.';
  }

  chooseCeleste.addEventListener('click', () => setSelected('celeste'));
  chooseAdrian.addEventListener('click', () => setSelected('adrian'));

  // Stub hook for now
  startShiftBtn.addEventListener('click', async () => {
    if (!selected) return;

    // Show story harness and start the engine using Code Blue JSON
    const harness = document.getElementById('storyHarness');
    harness.hidden = false;
    harness.classList.add('show');

    // Init engine (reads ./library/code_blue.json)
    const engine = new PanelEngine({
      narrativeEl: document.getElementById('panelNarrative'),
      choiceButtons: [
        document.getElementById('choice0'),
        document.getElementById('choice1'),
        document.getElementById('choice2'),
        document.getElementById('choice3'),
      ]
    });

    

    // Story background (user-provided asset)
    const bgEl = document.getElementById('storyBg');
    if (bgEl) bgEl.style.backgroundImage = "url('./assets/backgrounds/ui/codeblue-narrative-panel.webp')";

    // Load POV-specific JSON if present; fallback to code_blue.json
    try {
      await engine.init(storyIdSelected);
    } catch (e) {
      console.warn('POV JSON not found, falling back to code_blue.json', e);
      await engine.init('code_blue');
    }

    // TTS toggle for story harness
    tts.initToggle({
      buttonEl: document.getElementById('btnVoice'),
      onEnableSpeak: () => {
        const node = engine.story?.scenes?.[engine.current];
        if (node?.text) tts.speak(node.text);
      }
    });

    // Exit button: stop speech and hide harness
    document.getElementById('btnExitStory').onclick = () => {
      tts.stop();
      harness.classList.remove('show');
      setTimeout(() => { harness.hidden = true; }, 250);
    };
  });
})();
</script>


<script>
/* Fallback: if module JS fails to run (import blocked / 404), still allow splash -> montage. */
(function() {
  function byId(n) { return document.querySelector('.panel[data-panel="'+n+'"]'); }
  var splash = document.getElementById('splash');
  var enterBtn = document.getElementById('enterBtn');
  var titleCard = document.getElementById('titleCard');
  var startBtn = document.getElementById('startBtn');
  var overlay = document.getElementById('lightOverlay');
  var themeAudio = document.getElementById('themeAudio');

  var order = [9,1,6,2,8,3,4,7,5,1,6,2,9,3,8,5];
  var flashSet = {1:true,6:true,9:true};
  var idx = 0;
  var timer = null;
  var montageStarted = false;

  function setActive(num) {
    var panels = document.querySelectorAll('.panel');
    for (var i=0;i<panels.length;i++) panels[i].classList.remove('active');
    var el = byId(num);
    if (el) el.classList.add('active');
    if (overlay) {
      if (flashSet[num]) overlay.classList.add('hot');
      else overlay.classList.remove('hot');
    }
  }
  function next() { idx = (idx+1)%order.length; setActive(order[idx]); }
  function startLoop() { if (timer) clearInterval(timer); timer=setInterval(next, 5000); }
  function stopLoop() { if (timer) clearInterval(timer); timer=null; }

  // If module initialized, do nothing.
  setTimeout(function() {
    if (window.__vc_initialized) return;

    // Ensure we have a visible initial frame behind splash
    setActive(order[0]);
    stopLoop();

    function enter() {
      if (montageStarted) return;
      montageStarted = true;
      // show title card if it had been hidden
      if (titleCard) titleCard.hidden = false;
      startLoop();
      // try audio (works after user tap)
      try { if (themeAudio) { themeAudio.volume = 0.85; themeAudio.play(); } } catch(e) {}
      if (splash) {
        splash.classList.add('fade-out');
        setTimeout(function(){ splash.hidden = true; }, 450);
      }
    }

    if (enterBtn) enterBtn.onclick = enter;
    if (splash) splash.onclick = enter;

    if (startBtn) startBtn.onclick = function() {
      // This fallback stops at title card (character select requires module runtime).
      stopLoop();
      if (titleCard) titleCard.classList.add('fade-out');
    };
  }, 600);
})();
</script>

</body>
</html>
