<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Code Blue – Season One</title>
<link rel="stylesheet" href="./styles.css" />
</head>
<body>

<main class="intro-root" id="introRoot">

  <!-- Your panel mapping stays in styles.css. Do NOT change filenames here. -->
  <section class="panel" data-panel="1"></section> <!-- 01-hospital-night.webp -->
  <section class="panel" data-panel="2"></section>
  <section class="panel" data-panel="3"></section>
  <section class="panel" data-panel="4"></section>
  <section class="panel" data-panel="5"></section> <!-- 05-suspense.webp -->

  <section class="panel kinetic" data-panel="6"></section> <!-- flatline -->
  <section class="panel" data-panel="7"></section>         <!-- burnout -->
  <section class="panel" data-panel="8"></section>         <!-- icu -->
  <section class="panel kinetic" data-panel="9"></section> <!-- hallway run -->

  <!-- overlays -->
  <div class="light-overlay" id="lightOverlay"></div>
  <div class="vignette"></div>

  <div class="title-card" id="titleCard">
    <div class="title">CODE BLUE</div>
    <div class="subtitle">Season One</div>
    <button id="startBtn">START</button>
  </div>

</main>

<script>
(() => {
  const panels = Array.from(document.querySelectorAll('.panel'));
  const overlay = document.getElementById('lightOverlay');
  const titleCard = document.getElementById('titleCard');

  // Helper: map data-panel="N" -> element
  const byId = (n) => panels.find(p => p.dataset.panel === String(n));

  // Define which panels are "kinetic" (stronger ambulance lights + blur pulse)
  const kineticSet = new Set([6, 9]);

  // Interweave order: anchors appear repeatedly to keep the "show intro" feel
  // (Hospital night + suspense are your anchors)
  const order = [
    1, 9, 2, 6, 3, 8, 4, 7, 5,
    1, 6, 2, 9, 3, 8, 5
  ];

  let idx = 0;
  let timer = null;

  function setActive(panelNum) {
    panels.forEach(p => p.classList.remove('active'));
    const el = byId(panelNum);
    if (el) el.classList.add('active');

    // Make ambulance lights stronger only on kinetic scenes
    if (kineticSet.has(panelNum)) {
      overlay.classList.add('hot');
    } else {
      overlay.classList.remove('hot');
    }
  }

  function next() {
    idx = (idx + 1) % order.length;
    setActive(order[idx]);
  }

  function startLoop() {
    if (timer) clearInterval(timer);
    timer = setInterval(next, 8000);
  }

  // Init
  setActive(order[0]);
  startLoop();

  document.getElementById('startBtn').addEventListener('click', () => {
    if (timer) clearInterval(timer);
    titleCard.classList.add('fade-out');
  });
})();
</script>

</body>
</html>
